name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run pointless — except on main, where every
# commit should be deployed rather than skipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      # env.ts warns instead of throwing during the build phase, so this needs
      # no secrets. It catches broken imports and bad JSX, not bad SQL.
      - name: Build
        run: npm run build

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        env:
          DEPLOY_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail

          # An unset secret would otherwise reach curl as an empty string and
          # fail with "URL rejected", which says nothing about the real cause.
          if [ -z "${DEPLOY_URL}" ]; then
            echo "::error::COOLIFY_DEPLOY_URL is not set. Copy it from Coolify -> your app -> Webhooks, then add it under Settings -> Secrets -> Actions."
            exit 1
          fi
          if [ -z "${TOKEN}" ]; then
            echo "::error::COOLIFY_TOKEN is not set. Create one in Coolify -> Keys & Tokens."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${TOKEN}" \
            "${DEPLOY_URL}"
